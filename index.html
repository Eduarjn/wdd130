<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to Rapids Adventures Rafting. Book your next white water rafting trip with us today!">
    <meta name="author" content="Eduar Fajardo">
    <title>Home | Rapids Adventures Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Rapids Adventures Rafting logo" width="120">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Hero Image Corrigida -->
        <div class="hero">
            <img src="images/hero.jpg" alt="People white water rafting" width="100%">
            <h1 class="hero-heading">Feel the Rush!</h1>
        </div>

        <section class="newsletter">
            <h2>Subscribe to our Newsletter</h2>
            <form action="#" method="get">
                <label for="news-name">Name:</label>
                <input type="text" id="news-name" name="news-name" required>
                
                <label for="news-email">Email:</label>
                <input type="email" id="news-email" name="news-email" required>
                
                <button type="submit">Subscribe Now</button>
            </form>
        </section>

        <section class="cta">
            <h2>Ready for an Adventure?</h2>
            <a href="trips.html" class="action-btn">Book Your Trip Today</a>
        </section>

        <!-- Imagens Corrigidas do Grid -->
        <section class="home-grid">
            <div class="grid-item">
                <img src="images/happy-client.jpg" alt="Family having fun rafting">
                <h3>Family Trips</h3>
                <p>Safe and fun trips for all ages.</p>
            </div>
            <div class="grid-item">
                <img src="images/employee1.jpg" alt="Extreme white water rafting">
                <h3>Extreme Rapids</h3>
                <p>Test your limits on class 4 and 5 rapids.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 Rapids Adventures Rafting | Eduar Fajardo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.jpg" alt="Rapids Adventures Rafting on Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.jpg" alt="Rapids Adventures Rafting on LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.jpg" alt="Rapids Adventures Rafting on Instagram">
            </a>
        </nav>
    </footer>
</body>
</html>
