<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Rapids Adventures Rafting for any general inquiries, reservation questions, or website suggestions.">
    <meta name="author" content="Eduar Fajardo">
    <title>Contact Us | Rapids Adventures Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Rapids Adventures Rafting logo" width="120">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-main">
        <h1>Contact Us</h1>
        
        <div class="contact-grid">
            <section class="company-info">
                <h2>Get in Touch</h2>
                <p><strong>Address:</strong> 123 River Way, Rapids City, CO 80424</p>
                <p><strong>Phone:</strong> (555) 123-4567</p>
                <p><strong>Email:</strong> contact@wwrafting.com</p>
                
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3065.7484461426466!2d-104.99619168462211!3d39.75330367944888!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x876c78c43929497b%3A0x868350bb50d60d37!2sDenver%2C%20CO!5e0!3m2!1sen!2sus!4v1680000000000!5m2!1sen!2sus" width="600" height="250" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Google Map showing the company location"></iframe>
            </section>

            <section class="contact-form">
                <h2>Send us a Message</h2>
                <form action="#" method="get">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <fieldset>
                        <legend>Message Purpose:</legend>
                        <label><input type="radio" id="purpose-general" name="purpose" value="general"> General Inquiry</label>
                        <label><input type="radio" id="purpose-reservation" name="purpose" value="reservation"> Reservation Question</label>
                        <label><input type="radio" id="purpose-suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
                    </fieldset>

                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="4" required></textarea>
                    </div>

                    <div class="form-checkbox">
                        <label>
                            <input type="checkbox" id="newsletter" name="newsletter" value="subscribe"> Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Send Your Message</button>
                </form>
            </section>
        </div>

        <section class="employee-profiles">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee 1" width="150">
                    <figcaption>Senior Guide - John Doe</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee 2" width="150">
                    <figcaption>Reservation Specialist - Jane Smith</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee 3" width="150">
                    <figcaption>Safety Officer - Mike Johnson</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 Rapids Adventures Rafting | Eduar Fajardo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.jpg" alt="Rapids Adventures Rafting on Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.jpg" alt="Rapids Adventures Rafting on LinkedIn">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.jpg" alt="Rapids Adventures Rafting on Instagram">
            </a>
        </nav>
    </footer>
</body>
</html>
